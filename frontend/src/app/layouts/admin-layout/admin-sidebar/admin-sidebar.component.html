<aside class="admin-sidebar" [class.admin-sidebar--open]="isOpen" [attr.aria-label]="'admin_navigation' | t">
  <div class="admin-sidebar__top">
    <div class="admin-sidebar__brand">
      <div class="admin-brand-stack">
        <app-brand link="/home" />
        <span class="admin-panel-badge">{{ 'admin' | t }}</span>
      </div>
      <button class="admin-icon-button admin-sidebar__close" type="button" [attr.aria-label]="'close_admin_navigation' | t" (click)="closeMenu()">
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </div>

    <nav class="admin-nav">
      @for (item of navItems; track item.labelKey) {
        @if (item.route) {
          <a
            class="admin-nav__item"
            [routerLink]="item.route"
            routerLinkActive="admin-nav__item--active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()">
            <i class="bi {{ item.icon }}" aria-hidden="true"></i>
            <span>{{ item.labelKey | t }}</span>
          </a>
        } @else {
          <button class="admin-nav__item" type="button" aria-disabled="true">
            <i class="bi {{ item.icon }}" aria-hidden="true"></i>
            <span>{{ item.labelKey | t }}</span>
          </button>
        }
      }
    </nav>
  </div>

  <div class="admin-sidebar__bottom">
    <div class="admin-sidebar__controls">
      <app-locale-selector
        [compact]="true"
        menuPosition="top-start"
        [options]="localeOptions()"
        [value]="selectedLocale()"
        (valueChange)="updateLocale($event)">
      </app-locale-selector>
      <app-theme-toggle></app-theme-toggle>
    </div>

    <div class="admin-more-container" data-admin-more>
      <button
        class="admin-more-button"
        type="button"
        aria-haspopup="menu"
        [attr.aria-expanded]="moreMenuOpen()"
        (click)="toggleMoreMenu($event)">
        <i class="bi bi-list" aria-hidden="true"></i>
        <span>{{ 'more' | t }}</span>
      </button>

      @if (moreMenuOpen()) {
        <div class="admin-more__menu" role="menu">
          <a routerLink="/" (click)="closeMoreMenu()"><i class="bi bi-arrow-left" aria-hidden="true"></i>{{ 'back_to_feed_menu' | t }}</a>
          <a routerLink="/admin/settings" (click)="closeMoreMenu()"><i class="bi bi-gear" aria-hidden="true"></i>{{ 'settings' | t }}</a>
          <button type="button" (click)="logout()"><i class="bi bi-box-arrow-right" aria-hidden="true"></i>{{ 'sign_out' | t }}</button>
        </div>
      }
    </div>
  </div>
</aside>
