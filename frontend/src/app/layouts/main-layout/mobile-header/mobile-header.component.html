<header class="mobile-header">
  <div class="header-container">
    <button type="button" class="btn btn-link d-lg-none me-2 text-reset p-0" (click)="menuClick.emit()" [attr.aria-label]="'open_menu' | t">
      <i class="bi bi-list fs-3"></i>
    </button>
    
    <div (click)="onHomeClick($event)">
      <app-brand link="/home" style="pointer-events: none;" />
    </div>

    <div class="d-none d-sm-flex flex-grow-1 justify-content-center px-3">
      <div class="header-search-box w-100" style="max-width: 400px;" (click)="searchModalService.open()">
        <i class="bi bi-search"></i>
        <input type="text" readonly [placeholder]="'search_lingora' | t" (focus)="searchModalService.open()">
      </div>
    </div>
    
    <div class="d-flex align-items-center ms-auto gap-3">
      <button type="button" class="btn btn-link text-reset p-0 d-inline-flex align-items-center d-sm-none" 
              (click)="searchModalService.open()" 
              [attr.aria-label]="'search_lingora' | t">
        <i class="bi bi-search fs-5"></i>
      </button>

      <a routerLink="/workspace/create" [queryParams]="{ fresh: '1' }" class="btn btn-primary btn-sm fw-medium px-2 px-sm-3 rounded-pill d-inline-flex align-items-center">
        <i class="bi bi-plus-lg me-1"></i> <span>{{ 'create' | t }}</span>
      </a>

      <a routerLink="/profile" class="text-decoration-none">
        <img [appAssetImage]="profileAvatar" class="rounded-circle border" width="32" height="32" alt="Avatar" style="object-fit: cover;" />
      </a>
    </div>
  </div>
</header>
