<article class="post-card">
  <header class="post-header">
    <div class="author-tooltip-container position-relative">
      <a [routerLink]="['/profile', post.author.id]" class="author-group text-decoration-none">
        <img
          [appAssetImage]="authorAvatar"
          [alt]="post.author.name"
          class="author-avatar" />
        <div class="author-meta">
          <span class="author-name">{{ post.author.name }}</span>
          <span class="post-time">{{ post.createdAt | localizedDate }}</span>
        </div>
      </a>
      <app-author-tooltip [user]="post.author"></app-author-tooltip>
    </div>

    @if (categoryLabel) {
      <span class="category-badge">{{ categoryLabel }}</span>
    }
  </header>

  <a [routerLink]="['/post', post.id]" class="post-body-link">
    <h2 class="post-title">{{ translation?.title }}</h2>
    <div class="post-excerpt text-muted mb-3">{{ excerpt() }}</div>

    @if (post.coverImageUrl) {
      <div class="post-media">
        <img [src]="post.coverImageUrl" [alt]="translation?.title" />
      </div>
    }
  </a>

  <footer class="post-footer">
    <button type="button" class="footer-action" [class.liked]="post.liked" (click)="toggleLike($event)">
      <i class="bi" [class.bi-heart-fill]="post.liked" [class.bi-heart]="!post.liked"></i>
      <span>{{ post.likeCount | compactNumber }}</span>
    </button>

    <a [routerLink]="['/post', post.id]" class="footer-action" fragment="comments">
      <i class="bi bi-chat"></i>
      <span>{{ post.commentCount | compactNumber }}</span>
    </a>

    <span class="footer-action muted">
      <i class="bi bi-eye"></i>
      <span>{{ post.viewCount | compactNumber }}</span>
    </span>
  </footer>
</article>
