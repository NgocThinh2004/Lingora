<div class="explore-sticky-header sticky-top bg-body" #stickyHeader>
  <!-- Explore Search Bar with YouTube-style dropdown -->
  <div class="explore-search-header position-relative" id="exploreSearchBox">
    <div class="explore-search-input-box">
      <i class="bi bi-search text-muted fs-5"></i>
      <input type="text" id="explorePageSearchInput" class="explore-page-search-input" 
             placeholder="Search Lingora..." 
             data-i18n="search_placeholder" 
             autocomplete="off" 
             [value]="query" 
             (input)="updateQuery($event)">
      <button type="button" class="btn-clear-search" 
              [class.d-none]="!query" 
              id="exploreClearBtn" 
              aria-label="Clear" 
              (click)="clearQuery()">
        <i class="bi bi-x-lg fs-6"></i>
      </button>
    </div>
  </div>

  <!-- Substack Explore Tabs -->
  <div class="explore-tabs-nav border-bottom">
    <button class="explore-tab-btn" [class.active]="tab === 'top'" (click)="setTab('top')">Nổi bật</button>
    <button class="explore-tab-btn" [class.active]="tab === 'posts'" (click)="setTab('posts')">Bài viết</button>
    <button class="explore-tab-btn" [class.active]="tab === 'publications'" (click)="setTab('publications')">Chuyên mục</button>
    <button class="explore-tab-btn" [class.active]="tab === 'people'" (click)="setTab('people')">Tác giả</button>
  </div>
</div>

<!-- Search Query Header / Results Count -->
@if (query) {
  <div id="exploreQueryHeader" class="mb-3 text-muted small mt-4">
    <span>Kết quả cho </span><strong class="text-main">"{{ query }}"</strong>
  </div>
}

<!-- Results Feed Container -->
<div id="exploreResultsContainer" class="explore-results-list pb-5 mt-4" [style.opacity]="loading ? 0.3 : 1" style="transition: opacity 0.15s ease-in-out">
  
  @for (result of visibleResults; track result.title) {
    <a class="search-result-item text-decoration-none" [href]="result.href" style="display: flex; align-items: center; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--border-color);">
      <span class="d-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary flex-shrink-0" style="width:48px;height:48px"><i class="bi" [class]="result.icon"></i></span>
      <span class="search-result-content">
        <strong class="search-result-title d-block fs-6 mb-1">{{ result.title }}</strong>
        <span class="search-result-meta text-muted small">{{ result.subtitle }}</span>
      </span>
    </a>
  } @empty {
    @if (!loading) {
      <div class="text-center py-5 text-muted">
        <i class="bi bi-search fs-1 d-block mb-2"></i>
        <span>Không tìm thấy kết quả phù hợp.</span>
      </div>
    }
  }
</div>
