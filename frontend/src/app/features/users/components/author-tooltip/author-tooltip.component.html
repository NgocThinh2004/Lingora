<div
  class="author-hover-card"
  [class.flipped]="isFlipped"
  [style.top.px]="cardTop"
  [style.left.px]="cardLeft"
  (click)="$event.stopPropagation()">

  <!-- Avatar + Name row -->
  <div class="tooltip-author-row" (click)="goToAuthor($event)">
    <img [appAssetImage]="avatarUrl" class="tooltip-avatar" [alt]="user?.name || user?.username">
    <div>
      <div class="tooltip-name">{{ user?.name || user?.displayName || user?.username }}</div>
      <div class="tooltip-handle">&#64;{{ user?.handle || user?.username }}</div>
    </div>
  </div>

  <!-- Bio -->
  @if (user?.bio) {
    <p class="tooltip-bio">{{ user?.bio }}</p>
  }

  <!-- Footer: full-width follow button -->
  @if (isSelf) {
    <button class="btn btn-subscribe subscribed w-100" (click)="editProfile($event)">
      <span class="btn-text">{{ 'edit_profile' | t }}</span>
    </button>
  } @else if (user) {
    <app-subscribe-button [authorId]="user.id" [fullWidth]="true" />
  }
</div>
