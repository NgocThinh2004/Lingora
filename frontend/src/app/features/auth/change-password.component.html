<div class="feature-page feature-page-change-password">
<div class="password-page">
      <header class="password-topbar">
        <a class="back-link" href="/profile">
          <i class="bi bi-arrow-left"></i>
          <span data-i18n="back_to_profile">Back to profile</span>
        </a>
        <a class="brand" href="/home">Lingora</a>
      </header>

      <main class="password-main">
        <section class="password-card" aria-labelledby="changePasswordTitle">
          <header>
            <div class="password-icon" aria-hidden="true"><i class="bi bi-shield-lock"></i></div>
            <h1 id="changePasswordTitle" data-i18n="change_password">Change password</h1>
            <p data-i18n="password_description_long">Update the password for your Lingora account. Use a strong password that you do not use anywhere else.</p>
          </header>

          <form class="password-form" data-password-form (input)="validate($event)" (submit)="changePassword($event)">
            <div class="field">
              <label for="currentPassword" data-i18n="current_password_label">Current password</label>
              <div class="password-input-wrap">
                <input id="currentPassword" [type]="currentVisible ? 'text' : 'password'" autocomplete="current-password" data-password-field>
                <button class="toggle-password" type="button" aria-label="Show current password" data-toggle-password (click)="currentVisible = !currentVisible">
                  <i class="bi" [class.bi-eye]="!currentVisible" [class.bi-eye-slash]="currentVisible" aria-hidden="true"></i>
                </button>
              </div>
              <span id="currentPasswordError" class="password-message is-error" aria-live="polite">{{ currentError }}</span>
            </div>

            <div class="field">
              <label for="newPassword" data-i18n="new_password_label">New password</label>
              <div class="password-input-wrap">
                <input id="newPassword" [type]="newVisible ? 'text' : 'password'" autocomplete="new-password" data-password-field>
                <button class="toggle-password" type="button" aria-label="Show new password" data-toggle-password (click)="newVisible = !newVisible">
                  <i class="bi" [class.bi-eye]="!newVisible" [class.bi-eye-slash]="newVisible" aria-hidden="true"></i>
                </button>
              </div>
              <span id="newPasswordHint" class="password-hint" data-i18n="password_min_hint">Use at least 8 characters.</span>
              <span id="newPasswordError" class="password-message is-error" aria-live="polite">{{ newError }}</span>
            </div>

            <div class="field">
              <label for="confirmPassword" data-i18n="confirm_new_password_label">Confirm new password</label>
              <div class="password-input-wrap">
                <input id="confirmPassword" [type]="confirmVisible ? 'text' : 'password'" autocomplete="new-password" data-password-field>
                <button class="toggle-password" type="button" aria-label="Show confirm password" data-toggle-password (click)="confirmVisible = !confirmVisible">
                  <i class="bi" [class.bi-eye]="!confirmVisible" [class.bi-eye-slash]="confirmVisible" aria-hidden="true"></i>
                </button>
              </div>
              <span id="confirmPasswordError" class="password-message is-error" aria-live="polite">{{ confirmError }}</span>
            </div>
            
            <span id="globalMessage" class="password-message is-success" aria-live="polite">{{ message }}</span>

            <div class="form-actions">
              <a class="btn btn-secondary" href="/profile" data-i18n="cancel">Cancel</a>
              <button class="btn btn-primary" type="submit" data-submit-password data-i18n="update_password" [disabled]="!formValid">Update password</button>
            </div>
          </form>
        </section>
      </main>
    </div>
</div>
