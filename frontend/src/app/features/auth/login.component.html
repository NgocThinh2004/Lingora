<div class="feature-page feature-page-login">
<div class="auth-container">
    <div class="auth-card shadow-sm border">
      <!-- Header Logo / Title -->
      <div class="auth-header text-center mb-4 position-relative pt-3">
        <!-- Compact Top Right Controls -->
        <div class="position-absolute top-0 end-0 d-flex gap-1 mt-1 me-2" style="top: 8px !important;">
          <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-center p-0" type="button" id="authLangDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="width: 28px; height: 28px; border-radius: 6px; border-color: var(--border-color);">
              <img src="https://flagcdn.com/w20/gb.png" width="18" height="13" id="currentLangFlag" style="border-radius:2px; object-fit: cover;" alt="Language">
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow border-light-subtle" aria-labelledby="authLangDropdown" style="min-width: 120px; border-radius: 12px; font-size: 14px;">
              <li><a class="dropdown-item py-1.5 fw-medium global-lang-select" href="#" data-lang="en"><img src="https://flagcdn.com/w20/gb.png" width="18" alt="English" class="me-2" style="border-radius:2px;"> English</a></li>
              <li><a class="dropdown-item py-1.5 fw-medium global-lang-select" href="#" data-lang="vi"><img src="https://flagcdn.com/w20/vn.png" width="18" alt="Tiếng Việt" class="me-2" style="border-radius:2px;"> Tiếng Việt</a></li>
              <li><a class="dropdown-item py-1.5 fw-medium global-lang-select" href="#" data-lang="zh"><img src="https://flagcdn.com/w20/cn.png" width="18" alt="中文" class="me-2" style="border-radius:2px;"> 中文</a></li>
            </ul>
          </div>
          <button class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-center p-0" id="themeToggle" style="width: 28px; height: 28px; border-radius: 6px; border-color: var(--border-color); color: var(--text-main);" aria-label="Toggle theme">
            <i class="bi bi-moon-fill" id="themeIcon" style="font-size: 13px;"></i>
          </button>
        </div>
        <a href="/home" class="auth-logo d-inline-flex align-items-center gap-2 text-decoration-none">
          <i class="bi bi-bookmark-fill text-primary fs-3"></i>
          <span class="fs-4 fw-bold text-main">Lingora</span>
        </a>
        <h2 class="auth-title mt-3 fw-bold text-main" data-i18n="login">Log in</h2>
      </div>

      <!-- Alert Message -->
      <div id="authAlert" class="alert alert-danger p-2.5 rounded-3 mb-3 small" [class.d-none]="!alert" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span id="authAlertText">{{ alert }}</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" novalidate (submit)="login($event)">
        <div class="mb-3">
          <label for="loginEmail" class="form-label font-medium small" data-i18n="col_email">Email</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0 text-muted py-2"><i class="bi bi-envelope"></i></span>
            <input type="email" id="loginEmail" class="form-control border-start-0 py-2" placeholder="name&#64;example.com" autocomplete="email" required>
          </div>
          <div class="auth-field-error" id="loginEmailError" aria-live="polite">{{ emailError }}</div>
        </div>
        
        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="loginPassword" class="form-label font-medium small mb-0" data-i18n="password">Password</label>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0 text-muted py-2"><i class="bi bi-lock"></i></span>
            <input [type]="passwordVisible ? 'text' : 'password'" id="loginPassword" class="form-control border-start-0 border-end-0 py-2" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="btn border border-start-0 text-muted bg-transparent py-2" id="togglePasswordBtn" aria-label="Toggle password visibility" (click)="passwordVisible = !passwordVisible">
              <i class="bi" [class.bi-eye]="!passwordVisible" [class.bi-eye-slash]="passwordVisible"></i>
            </button>
          </div>
          <div class="auth-field-error" id="loginPasswordError" aria-live="polite">{{ passwordError }}</div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-pill fw-semibold mb-3" data-i18n="login">Log in</button>
      </form>

      <!-- Redirect to Register -->
      <div class="text-center text-muted small mb-4">
        <span data-i18n="dont_have_account">Don't have an account?</span> <a href="/auth/register" class="text-primary fw-semibold text-decoration-none" data-i18n="register_here">Register here</a>
      </div>

          </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  
  <!-- Core Script containing theme & language simulation -->
</div>
