<app-auth-layout>
  <div auth-heading>
    <h1 id="auth-page-title" class="auth-title mt-4 mb-2">{{ 'forgot_password' | t }}</h1>
    <p class="auth-subtitle text-muted mb-0">
      {{ 'forgot_password_description' | t }}
    </p>
  </div>

  @if (errorMessage) {
    <div class="alert alert-danger d-flex align-items-start gap-2 py-2 px-3 small" role="alert">
      <i class="bi bi-exclamation-triangle-fill mt-1" aria-hidden="true"></i>
      <span>{{ errorMessage }}</span>
    </div>
  }

  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="mb-4">
      <label for="recoveryEmail" class="form-label small fw-semibold">{{ 'email_address' | t }}</label>
      <div class="input-group">
        <span class="input-group-text bg-transparent border-end-0 text-muted">
          <i class="bi bi-envelope" aria-hidden="true"></i>
        </span>
        <input
          id="recoveryEmail"
          class="form-control border-start-0 py-2"
          type="email"
          formControlName="email"
          [class.is-invalid]="forgotPasswordForm.controls.email.touched && forgotPasswordForm.controls.email.invalid"
          [attr.aria-invalid]="forgotPasswordForm.controls.email.touched && forgotPasswordForm.controls.email.invalid"
          placeholder="name@example.com"
          autocomplete="email"
          required>
      </div>
      @if (forgotPasswordForm.controls.email.touched && forgotPasswordForm.controls.email.invalid) {
        <div class="text-danger small mt-1" aria-live="polite">{{ 'enter_valid_email' | t }}</div>
      }
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold mb-3" [disabled]="isSubmitting">
      @if (isSubmitting) {
        <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
      }
      {{ (isSubmitting ? 'sending_code' : 'send_reset_code') | t }}
    </button>
  </form>

  <p class="text-center text-muted small mb-0">
    {{ 'remembered_password' | t }}
    <a routerLink="/auth/login" class="text-primary fw-semibold">{{ 'back_to_sign_in' | t }}</a>
  </p>
</app-auth-layout>
