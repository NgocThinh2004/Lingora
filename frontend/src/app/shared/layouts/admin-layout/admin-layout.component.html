<div class="admin-shell">
  <header class="admin-mobile-header">
    <button class="admin-icon-button" type="button" aria-label="Open admin navigation" (click)="menuOpen.set(true)">
      <i class="bi bi-list" aria-hidden="true"></i>
    </button>
    <app-brand></app-brand>
  </header>

  @if (menuOpen()) {
    <button class="admin-backdrop" type="button" aria-label="Close admin navigation" (click)="closeMenu()"></button>
  }

  <aside class="admin-sidebar" [class.admin-sidebar--open]="menuOpen()" aria-label="Admin navigation">
    <div class="admin-sidebar__top">
      <div class="admin-sidebar__brand">
        <div class="admin-brand-stack">
          <app-brand></app-brand>
          <span class="admin-panel-badge">Admin Panel</span>
        </div>
        <button class="admin-icon-button admin-sidebar__close" type="button" aria-label="Close admin navigation" (click)="closeMenu()">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </div>

      <nav class="admin-nav">
        @for (item of navItems; track item.label) {
          @if (item.route) {
            <a
              class="admin-nav__item"
              [routerLink]="item.route"
              routerLinkActive="admin-nav__item--active"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="closeMenu()">
              <i class="bi {{ item.icon }}" aria-hidden="true"></i>
              <span>{{ item.label }}</span>
            </a>
          } @else {
            <button class="admin-nav__item" type="button" aria-disabled="true">
              <i class="bi {{ item.icon }}" aria-hidden="true"></i>
              <span>{{ item.label }}</span>
            </button>
          }
        }
      </nav>
    </div>

    <div class="admin-sidebar__bottom">
      <div class="admin-sidebar__controls">
        <app-locale-selector
          [compact]="true"
          menuPosition="top-start"
          [options]="localeOptions()"
          [value]="selectedLocale()"
          (valueChange)="updateLocale($event)">
        </app-locale-selector>
        <app-theme-toggle></app-theme-toggle>
      </div>

      <details class="admin-more">
        <summary><i class="bi bi-list" aria-hidden="true"></i><span>More</span></summary>
        <div class="admin-more__menu">
          <a routerLink="/" (click)="closeMenu()"><i class="bi bi-arrow-left" aria-hidden="true"></i>Back to Feed</a>
          <a routerLink="/admin/settings" (click)="closeMenu()"><i class="bi bi-gear" aria-hidden="true"></i>Settings</a>
          <button type="button" (click)="logout()"><i class="bi bi-box-arrow-right" aria-hidden="true"></i>Sign Out</button>
        </div>
      </details>
    </div>
  </aside>

  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
