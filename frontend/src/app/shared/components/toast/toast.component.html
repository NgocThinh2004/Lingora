@if (toastData) {
  <div
    class="app-toast"
    [class.app-toast--visible]="isVisible"
    [class.app-toast--error]="toastData.type === 'error'"
    role="status"
    aria-live="polite"
    aria-atomic="true">
    <i
      class="bi app-toast__icon"
      [ngClass]="toastData.type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-circle-fill'"
      aria-hidden="true">
    </i>
    <span class="app-toast__message">{{ toastData.message }}</span>
    <button class="app-toast__close" type="button" aria-label="Dismiss notification" (click)="dismiss()">
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
  </div>
}
