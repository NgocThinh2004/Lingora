@if (modalService.isOpen()) {
  <div class="modal-backdrop fade show" (click)="close(false)"></div>
  <div class="modal fade show" tabindex="-1" style="display: block;" aria-modal="true" role="dialog" (click)="close(false)">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 500px;">
      <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden p-3" (click)="$event.stopPropagation()">
        
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div style="width: 24px;"></div> <!-- Spacer for centering title -->
          <h4 class="fw-bold text-main mb-0 fs-5 text-center flex-grow-1">Rời khỏi trang?</h4>
          <button type="button" class="btn-close shadow-none" (click)="close(false)" aria-label="Close" style="font-size: 0.85rem;"></button>
        </div>
        
        <div class="modal-body p-2 pt-0 pb-3">
          <p class="text-secondary mb-4" style="font-size: 1rem;">
            Bạn chưa hoàn tất bình luận. Bạn có muốn rời mà không hoàn tất không?
          </p>
          
          <div class="d-flex justify-content-end gap-3 align-items-center">
            <button type="button" class="btn text-primary fw-semibold px-3 py-2" (click)="close(false)" style="border-radius: 8px; font-size: 0.95rem;">
              Ở lại Trang
            </button>
            <button type="button" class="btn btn-primary fw-semibold px-4 py-2" (click)="close(true)" style="border-radius: 8px; font-size: 0.95rem;">
              Rời khỏi Trang
            </button>
          </div>
        </div>
        
      </div>
    </div>
  </div>
}
