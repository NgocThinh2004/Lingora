<aside class="right-panel">
  <button type="button" class="search-box" (click)="searchModalService.open()">
    <i class="bi bi-search"></i>
    <span class="search-placeholder">Tìm kiếm trên Lingora...</span>
  </button>

  <div class="widget">
    <div class="widget-header">
      <h6>Gợi ý cho bạn</h6>
      <a routerLink="/explore" class="see-all">Xem tất cả</a>
    </div>

    @if (recommendedAuthors().length > 0) {
      <div class="authors-list">
        @for (author of recommendedAuthors(); track author.id) {
          <div class="author-item">
            <div class="author-info">
              <img [src]="author.avatarUrl || 'assets/images/default-avatar.svg'" [alt]="author.name" class="avatar" />
              <div class="meta">
                <span class="name">{{ author.name }}</span>
                <span class="bio">{{ author.bio || 'Tác giả Lingora' }}</span>
              </div>
            </div>
            <a [routerLink]="['/profile', author.id]" class="btn-profile">Xem hồ sơ</a>
          </div>
        }
      </div>
    } @else {
      <p class="muted small">Đang tải danh sách tác giả...</p>
    }
  </div>
</aside>
