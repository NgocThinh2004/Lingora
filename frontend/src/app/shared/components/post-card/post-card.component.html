<article class="post-card">
  <header class="post-header">
    <a [routerLink]="['/profile', post.author.id]" class="author-group">
      <img [src]="post.author.avatarUrl || 'assets/images/default-avatar.svg'" [alt]="post.author.name" class="author-avatar" />
      <div class="author-meta">
        <span class="author-name">{{ post.author.name }}</span>
        <span class="post-time">{{ post.createdAt | date: 'mediumDate' }}</span>
      </div>
    </a>

    @if (categoryLabel) {
      <span class="category-badge">{{ categoryLabel }}</span>
    }
  </header>

  <a [routerLink]="['/post', post.id]" class="post-body-link">
    <h2 class="post-title">{{ translation?.title }}</h2>
    <div class="post-excerpt" [innerHTML]="translation?.contentHtml"></div>

    @if (post.coverImageUrl || post.coverVideoUrl) {
      <div class="post-media">
        @if (isVideo) {
          <video [src]="post.coverVideoUrl || post.coverImageUrl" muted loop playsinline controls></video>
        } @else {
          <img [src]="post.coverImageUrl" [alt]="translation?.title" />
        }
      </div>
    }
  </a>

  <footer class="post-footer">
    <button type="button" class="footer-action" [class.liked]="post.liked" (click)="toggleLike($event)">
      <i class="bi" [class.bi-heart-fill]="post.liked" [class.bi-heart]="!post.liked"></i>
      <span>{{ post.likeCount ?? 0 }}</span>
    </button>

    <a [routerLink]="['/post', post.id]" class="footer-action" fragment="comments">
      <i class="bi bi-chat"></i>
      <span>{{ post.commentCount ?? 0 }}</span>
    </a>

    <span class="footer-action muted">
      <i class="bi bi-eye"></i>
      <span>{{ post.viewCount }}</span>
    </span>
  </footer>
</article>
