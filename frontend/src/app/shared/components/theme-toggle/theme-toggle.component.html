<button
  class="theme-toggle"
  type="button"
  (click)="toggle()"
  [attr.aria-label]="(isDark() ? 'use_light_theme' : 'use_dark_theme') | t"
  [attr.title]="(isDark() ? 'use_light_theme' : 'use_dark_theme') | t">
  <i class="bi" [class.bi-sun-fill]="isDark()" [class.bi-moon-stars-fill]="!isDark()" aria-hidden="true"></i>
</button>
