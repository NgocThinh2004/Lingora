<button class="btn rounded-pill fw-medium btn-subscribe" 
        [class.subscribed]="isSubscribed" 
        (click)="toggleSubscribe($event)"
        [disabled]="loading">
  <span class="btn-subscribe-label">
    @if (loading) {
      <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
    }
    @if (isSubscribed) {
      <span class="btn-text">Đang theo dõi</span>
    } @else {
      Theo dõi
    }
  </span>
</button>
