<button class="btn rounded-pill fw-medium btn-subscribe" 
        [class.subscribed]="isSubscribed" 
        (click)="toggleSubscribe($event)"
        [disabled]="loading">
  <span class="btn-subscribe-label d-flex align-items-center justify-content-center gap-1">
    @if (loading) {
      <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
    }
    @if (isSubscribed) {
      <span class="btn-text">Following</span>
    } @else {
      <span class="btn-text">Follow</span>
    }
  </span>
</button>
